name: 🚀 Release + Publish

on: [workflow_dispatch]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  # ───────────────────────────────────────────────
  # Phase 1: Create the release (runs once)
  # ───────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.metadata.outputs.version }}
      extension-file: ${{ steps.metadata.outputs.extension-file }}

    steps:
      - name: ✅ Use App Token for the Bot which is allowed to create releases
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for fetching tags and generating release notes
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # Resolve the current branch tip, including after waiting for another run.
          ref: ${{ github.ref_name }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 📜 Prepare version and changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install changelog-machine --bump --resolve-contributors

      - name: 🚀 Prepare release
        run: npm run preversion

      - name: 📝 Get metadata
        id: metadata
        run: |
          VERSION=$(jq -r '.version' package.json)
          NAME=$(jq -r '.name' package.json)

          EXTENSION_FILE="${NAME}-${VERSION}.vsix"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "extension-file=$EXTENSION_FILE" >> "$GITHUB_OUTPUT"

      - name: 🧪 Test
        run: npm test

      - name: 🛠️ Build extension
        run: npx @vscode/vsce package

      - name: 🔒 Attest artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # Read: https://docs.github.com/en/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds
        with:
          subject-path: ${{ steps.metadata.outputs.extension-file }}

      - name: 📤 Upload extension artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: ${{ steps.metadata.outputs.extension-file }}
          if-no-files-found: error
          retention-days: 3

      - name: 🏷️ Commit and push release tag
        env:
          HUSKY: 0
          VERSION: ${{ steps.metadata.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git add package.json package-lock.json CHANGELOG.md images/*.png icons/*.svg
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push --atomic origin "HEAD:refs/heads/${BRANCH}" "refs/tags/v${VERSION}"

      - name: 🚀 Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
          EXTENSION_FILE: ${{ steps.metadata.outputs.extension-file }}
        run: |
          gh release create "v${VERSION}" "$EXTENSION_FILE" \
            --verify-tag --title "v${VERSION}" \
            --generate-notes

  # ───────────────────────────────────────────────
  # Phase 2: Publish everywhere (parallel jobs)
  # ───────────────────────────────────────────────
  publish-open-vsx:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download extension artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      - name: 🌐 Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2.1.0
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: ${{ needs.release.outputs.extension-file }}

  publish-vscode-marketplace:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download extension artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      - name: 🌐 Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2.1.0
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ needs.release.outputs.extension-file }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build package
        run: npm run build

      - name: 📦 Publish to NPM Registry
        run: npm publish --provenance --access public
